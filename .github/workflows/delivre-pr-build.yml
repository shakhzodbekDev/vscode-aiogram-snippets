name: Delivre temporary PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Delivre sources
        run: |
          cat delivre-src.b64.part* | base64 -d > delivre-src.zip
          unzip -t delivre-src.zip
          unzip -q delivre-src.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build release
        run: gradle --no-daemon :app:assembleRelease

      - name: Sign and verify release APK
        run: |
          STOREPASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v -keystore delivre-release.jks -storepass "$STOREPASS" -keypass "$STOREPASS" -alias delivre -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Delivre, OU=Release, O=Delivre, L=Tashkent, ST=Tashkent, C=UZ"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk Delivre-release-aligned.apk
          "$BT/apksigner" sign --ks delivre-release.jks --ks-key-alias delivre --ks-pass "pass:$STOREPASS" --key-pass "pass:$STOREPASS" --out Delivre-release-signed.apk Delivre-release-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Delivre-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Delivre-release-signed
          path: Delivre-release-signed.apk
          if-no-files-found: error
          retention-days: 7
